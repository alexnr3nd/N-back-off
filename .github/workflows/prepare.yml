
name: Preparar codigo recuperado

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair codigo
        run: |
          mkdir -p extracted
          unzip -q dualnback_recovered_sources.zip -d extracted

          cp -R extracted/recovered-src/. .

          cp extracted/RECOVERY_NOTES.md ./RECOVERY_NOTES.md

      - name: Salvar arquivos no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src functions RECOVERY_NOTES.md

          if ! git diff --cached --quiet; then
            git commit -m "Add recovered application source"
            git push
          fi
