name: Build Android debug APK

on:
  push:
    branches:
      - offline-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout offline rebuild
        uses: actions/checkout@v4
        with:
          ref: offline-rebuild

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Restore local visual assets and CSS
        run: bash scripts/restore-public-assets.sh

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build React application
        env:
          CI: 'false'
          GENERATE_SOURCEMAP: 'false'
          DISABLE_ESLINT_PLUGIN: 'true'
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Remove merged Android internet permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          for permission in ('INTERNET', 'ACCESS_NETWORK_STATE'):
              s = re.sub(r'<uses-permission\b(?=[^>]*android:name="android.permission.' + permission + r'")[^>]*/>\s*', '', s)
          s = s.replace('xmlns:android="http://schemas.android.com/apk/res/android"', 'xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"')
          rules = ('    <uses-permission android:name="android.permission.INTERNET" tools:node="remove" />\n'
                   '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" tools:node="remove" />\n')
          if 'tools:node="remove"' not in s:
              s = s.replace('<application', rules + '    <application', 1)
          p.write_text(s)
          if 'android.permission.INTERNET" tools:node="remove"' not in s:
              raise SystemExit('Failed to add manifest merger removal rule')
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify final APK has no network permissions
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | tee /tmp/apk-permissions.txt
          ! grep -qE 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' /tmp/apk-permissions.txt

      - name: Install screenshot inspection dependency
        run: python3 -m pip install --user --break-system-packages pillow

      - name: Smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.dualnback.android
            adb shell monkey -p com.dualnback.android 1
            sleep 25
            test -n "$(adb shell pidof com.dualnback.android)"
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity'
            mkdir -p /tmp/dual-n-back-smoke
            adb exec-out screencap -p > /tmp/dual-n-back-smoke/startup.png
            adb logcat -d -t 12000 > /tmp/dual-n-back-smoke/logcat.txt
            python3 - <<'PY'
            from pathlib import Path
            import re
            from PIL import Image
            log = Path('/tmp/dual-n-back-smoke/logcat.txt').read_text(errors='replace')
            if re.search(r'FATAL EXCEPTION|Process: com\.dualnback\.android', log):
                raise SystemExit('App crashed during startup')
            im = Image.open('/tmp/dual-n-back-smoke/startup.png').convert('RGB')
            colors = im.getcolors(im.width * im.height) or []
            dominant = max((count for count, color in colors), default=0)
            ratio = dominant / (im.width * im.height)
            print(f'Screenshot dominant-color ratio: {ratio:.1%}')
            if ratio > 0.90:
                raise SystemExit('Startup screen appears blank or stuck on splash screen')
            PY

      - name: Upload emulator startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-n-back-emulator-startup-evidence
          path: /tmp/dual-n-back-smoke/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dual-n-back-offline-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
